name: Curated CD

# Build the curated image on a runner, push it to a registry, then roll it out over SSH.
# The server never builds anything: `pip install .` is the step most likely to OOM on a
# 2 vCPU / 2 GB host, and pulling one image is both faster and reversible.
#
# qdrant is mirrored into the same registry (`<prefix>/mem0-curated-qdrant:<tag>`) because
# the deploy host often cannot reach Docker Hub at all. The mirror is skipped once present.
#
# Required repository secrets:
#   DEPLOY_HOST      public IP or DNS name of the server
#   DEPLOY_USER      SSH user, must be able to run docker
#   DEPLOY_SSH_KEY   private key whose public half is in that user's authorized_keys
# Optional secrets:
#   DEPLOY_PORT         SSH port (default 22)
#   GHCR_PULL_TOKEN     only when the GHCR package is private; PAT with read:packages
#   CURATED_REGISTRY_TOKEN  password for a non-GHCR registry (see CURATED_IMAGE)
#
# Optional repository variables:
#   DEPLOY_PATH             deploy directory on the host (default /opt/mem0-curated)
#   CURATED_IMAGE           full image name, e.g. registry.cn-hangzhou.aliyuncs.com/ns/mem0-curated
#   CURATED_REGISTRY_USER   registry user that matches CURATED_REGISTRY_TOKEN
on:
  push:
    branches: [main]
    paths:
      - "curated/**"
      - "mem0/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/curated-cd.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build and deploy; empty means the branch this run was dispatched from"
        required: false
        type: string

concurrency:
  group: curated-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.name }}
      qdrant: ${{ steps.image.outputs.qdrant }}
      registry: ${{ steps.image.outputs.registry }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve image coordinates
        id: image
        env:
          CUSTOM_IMAGE: ${{ vars.CURATED_IMAGE }}
          QDRANT_SOURCE: qdrant/qdrant:v1.12.4
        run: |
          set -euo pipefail
          if [ -n "${CUSTOM_IMAGE:-}" ]; then
            name="$CUSTOM_IMAGE"
          else
            owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            name="ghcr.io/${owner}/mem0-curated"
          fi
          tag="$(git rev-parse --short=12 HEAD)"
          {
            echo "name=${name}"
            echo "qdrant=${name%/*}/mem0-curated-qdrant:${QDRANT_SOURCE##*:}"
            echo "registry=${name%%/*}"
            echo "tag=${tag}"
            echo "tags<<EOF"
            echo "${name}:${tag}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${name}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ vars.CURATED_REGISTRY_USER || github.actor }}
          password: ${{ secrets.CURATED_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: curated/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=curated
          cache-to: type=gha,mode=max,scope=curated

      - name: Mirror qdrant into the same registry
        env:
          QDRANT_SOURCE: qdrant/qdrant:v1.12.4
          QDRANT_TARGET: ${{ steps.image.outputs.qdrant }}
        run: |
          set -euo pipefail
          # The deploy host may not reach Docker Hub at all (it is blocked from mainland
          # China often enough to matter), so both images must come from one registry.
          if docker manifest inspect "$QDRANT_TARGET" >/dev/null 2>&1; then
            echo "$QDRANT_TARGET already exists; nothing to do."
            exit 0
          fi
          docker pull "$QDRANT_SOURCE"
          docker tag "$QDRANT_SOURCE" "$QDRANT_TARGET"
          docker push "$QDRANT_TARGET"

  deploy:
    name: Roll out over SSH
    needs: build
    runs-on: ubuntu-latest
    # The first pull can be slow from mainland China; later deploys move only changed layers.
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret ${name} is missing; see the header of this workflow."
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${port}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload deploy files
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          path="${DEPLOY_PATH:-/opt/mem0-curated}"
          ssh deploy "mkdir -p '$path'"
          scp -q curated/docker-compose.yml curated/deploy.sh curated/.env.example "deploy:$path/"
          ssh deploy "chmod +x '$path/deploy.sh'"

      - name: Authenticate the host to the registry
        env:
          REGISTRY: ${{ needs.build.outputs.registry }}
          REGISTRY_USER: ${{ vars.CURATED_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.CURATED_REGISTRY_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -n "$REGISTRY_TOKEN" ]; then
            printf '%s' "$REGISTRY_TOKEN" | ssh deploy "docker login '$REGISTRY' -u '$REGISTRY_USER' --password-stdin"
          elif [ "$REGISTRY" = "ghcr.io" ] && [ -n "$GHCR_PULL_TOKEN" ]; then
            printf '%s' "$GHCR_PULL_TOKEN" | ssh deploy "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          else
            echo "No registry token configured; assuming ${REGISTRY} allows anonymous pulls."
          fi

      - name: Pull and restart
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          path="${DEPLOY_PATH:-/opt/mem0-curated}"
          ssh deploy "cd '$path' && MEM0_CURATED_IMAGE='${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}' QDRANT_IMAGE='${{ needs.build.outputs.qdrant }}' HEALTH_WAIT_SECONDS=600 ./deploy.sh pull"
