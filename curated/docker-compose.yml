name: mem0-curated

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - curated_network

  mem0-curated:
    build:
      context: ..
      dockerfile: curated/Dockerfile
    # One image, several processes: gateway and dashboard are the same code with a
    # different command. CI overrides MEM0_CURATED_IMAGE with the SHA tag it just
    # pushed; the fixed default keeps `docker save` reproducible on an offline host.
    image: ${MEM0_CURATED_IMAGE:-mem0-curated:1.0.0}
    restart: unless-stopped
    command: ["uvicorn", "curated.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in curated/.env}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-experiences}
      - EMBEDDER_PROVIDER=${EMBEDDER_PROVIDER:-fastembed}
      - EMBEDDER_MODEL=${EMBEDDER_MODEL:-BAAI/bge-small-en-v1.5}
      - EMBEDDER_DIMS=${EMBEDDER_DIMS:-384}
      - HISTORY_DB_PATH=/data/history/history.db
      - FASTEMBED_CACHE_PATH=/data/fastembed
      - HF_HOME=/data/fastembed
      - MEM0_TELEMETRY=false
    volumes:
      - ./data/history:/data/history
      - ./data/fastembed:/data/fastembed
    # Deliberately no `ports`: only the gateway may reach this service.
    expose:
      - "8000"
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - curated_network

  gateway:
    # No build here on purpose: `depends_on` above builds the shared image first, so the
    # Dockerfile is compiled exactly once per deploy.
    image: ${MEM0_CURATED_IMAGE:-mem0-curated:1.0.0}
    restart: unless-stopped
    command: ["uvicorn", "curated.gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in curated/.env}
      - UPSTREAM_URL=http://mem0-curated:8000
    ports:
      - "8787:8000"
    depends_on:
      mem0-curated:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - curated_network

  dashboard:
    image: ${MEM0_CURATED_IMAGE:-mem0-curated:1.0.0}
    restart: unless-stopped
    command: ["uvicorn", "curated.dashboard.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      # The curator key stays in this process. The browser talks to the dashboard, never to
      # the gateway, so no key ever reaches page source or localStorage.
      - CURATED_GATEWAY_URL=http://gateway:8000
      - CURATED_API_KEYS=${CURATOR_API_KEYS:?CURATOR_API_KEYS must be set in curated/.env}
      - CURATED_PROJECT_ID=${CURATED_PROJECT_ID:-default}
    # Loopback only: the admin console can write, so it must not be reachable from the LAN.
    ports:
      - "127.0.0.1:8788:8000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - curated_network

networks:
  curated_network:
    driver: bridge
