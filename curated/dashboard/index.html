<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curated · 经验记忆看板</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --line: #e2e5e9;
    --line-strong: #cfd4da;
    --text: #15181d;
    --muted: #6a7280;
    --accent: #0f766e;
    --accent-weak: #e7f4f1;
    --ok: #067647;
    --ok-weak: #e7f6ee;
    --warn: #b45309;
    --warn-weak: #fdf3e3;
    --danger: #b42318;
    --danger-weak: #fdeceb;
    --radius: 10px;
    --shadow: 0 12px 32px rgba(16, 24, 40, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* top bar */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px;
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 13px;
  }
  .brand h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .brand span { color: var(--muted); font-size: 12px; }
  .topbar .spacer { flex: 1; }
  .project-wrap { display: flex; align-items: center; gap: 8px; }
  .project-wrap label { color: var(--muted); font-size: 12px; }
  .project-wrap input {
    width: 180px; padding: 7px 10px;
    border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
  }
  .project-wrap input:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--surface);
    transition: background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #0c625b; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: rgba(0,0,0,.04); color: var(--text); }
  .btn.danger { color: var(--danger); border-color: #f0c2bf; background: var(--danger-weak); }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; display: grid; place-items: center;
  }
  .icon-btn:hover { background: rgba(0,0,0,.06); color: var(--text); }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 24px 64px; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 24px; font-weight: 650; margin-top: 2px; letter-spacing: -.02em; }
  .stat .v.small { font-size: 18px; }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 16px; overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .panel-head h2 { font-size: 13px; margin: 0; font-weight: 650; color: var(--muted); letter-spacing: .3px; text-transform: uppercase; }
  .panel-head .spacer { flex: 1; }

  /* tag bars */
  .tags { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px; padding: 14px 16px; }
  .tag-row { display: grid; grid-template-columns: 140px 1fr 36px; align-items: center; gap: 10px; cursor: pointer; }
  .tag-row:hover .tag-name { color: var(--accent); }
  .tag-name { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag-track { height: 7px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .tag-fill { height: 100%; background: var(--accent); border-radius: 4px; opacity: .75; }
  .tag-count { font-size: 12px; color: var(--muted); text-align: right; }
  .empty-inline { color: var(--muted); padding: 8px 16px 16px; }

  /* toolbar */
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .search { display: flex; gap: 8px; flex: 1; min-width: 240px; }
  .search input {
    flex: 1; padding: 8px 11px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
  }
  .search input:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
  .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px; border-radius: 999px; background: var(--accent-weak); color: var(--accent);
    font-size: 12px;
  }
  .filter-chip button { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 0; }

  /* table */
  .table-wrap { overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    text-align: left; font-size: 12px; font-weight: 600; color: var(--muted);
    padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; transition: background .12s; }
  tbody tr:hover { background: #f9fafb; }
  tbody tr:last-child td { border-bottom: 0; }
  .sum { font-weight: 550; }
  .goal { color: var(--muted); font-size: 12px; margin-top: 2px; max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; max-width: 240px; }
  .chip {
    font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
  }
  .conf { display: flex; align-items: center; gap: 8px; }
  .conf-track { width: 56px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .conf-fill { height: 100%; background: var(--accent); }
  .conf-num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.active { background: var(--ok-weak); color: var(--ok); }
  .pill.deprecated { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .muted { color: var(--muted); }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--text); margin-bottom: 4px; }

  /* drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(16,24,40,.28);
    opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 30;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
    background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: var(--shadow); z-index: 40;
    transform: translateX(102%); transition: transform .22s ease;
    display: flex; flex-direction: column;
  }
  .drawer.show { transform: translateX(0); }
  .drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { font-size: 16px; margin: 0 0 6px; line-height: 1.35; }
  .drawer-body { padding: 18px 20px 40px; overflow: auto; }
  .drawer-foot { margin-top: auto; display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-bottom: 18px; }
  .meta-grid .k { font-size: 11px; color: var(--muted); letter-spacing: .3px; }
  .meta-grid .v { font-size: 13px; word-break: break-word; }
  .section { margin-bottom: 20px; }
  .section h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 0 0 8px; }
  .section p { margin: 0; }
  .kv { border-left: 2px solid var(--line); padding-left: 10px; }
  .steps { margin: 0; padding-left: 18px; }
  .steps li { margin-bottom: 4px; }
  .attempt {
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface-2);
  }
  .attempt .row { margin-bottom: 4px; font-size: 13px; }
  .attempt .row:last-child { margin-bottom: 0; }
  .attempt .lab { color: var(--muted); font-size: 11px; margin-right: 6px; }
  .link-btn { border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 0; font-family: inherit; font-size: inherit; }

  /* dialogs */
  dialog.sheet {
    border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(680px, calc(100vw - 32px));
    max-height: min(88vh, 900px); box-shadow: var(--shadow); color: var(--text); background: var(--surface);
  }
  dialog.sheet::backdrop { background: rgba(16,24,40,.34); }
  dialog.sheet.small { width: min(460px, calc(100vw - 32px)); }
  .sheet form { display: flex; flex-direction: column; max-height: inherit; }
  .sheet-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { font-size: 16px; margin: 0; flex: 1; }
  .sheet-body { padding: 18px 20px; overflow: auto; }
  .sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--surface); resize: vertical;
  }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .attempts { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0 0 14px; }
  .attempts legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
  .attempt-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr 28px; gap: 6px; margin-bottom: 6px; }
  .attempt-inputs input { padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; }
  .notice { padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .notice.warn { background: var(--warn-weak); color: var(--warn); }
  .notice.danger { background: var(--danger-weak); color: var(--danger); }
  .notice ul { margin: 6px 0 0; padding-left: 18px; }

  /* toasts */
  #toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    padding: 10px 16px; border-radius: 9px; background: #1f242c; color: #fff; font-size: 13px;
    box-shadow: var(--shadow); animation: rise .2s ease;
  }
  .toast.error { background: var(--danger); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 820px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .tags { grid-template-columns: 1fr; }
    .hide-sm { display: none; }
    .project-wrap input { width: 120px; }
    .grid2 { grid-template-columns: 1fr; }
    .attempt-inputs { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">C</div>
    <div>
      <h1>curated</h1>
      <span>共享经验记忆 · 只经由网关</span>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="project-wrap">
    <label for="project">项目</label>
    <input id="project" spellcheck="false" autocomplete="off">
  </div>
  <button class="btn" id="refresh">刷新</button>
  <button class="btn primary" id="new-record">新建经验</button>
</header>

<main>
  <section class="stats" id="stats"></section>

  <section class="panel" id="tag-panel">
    <div class="panel-head">
      <h2>标签分布</h2>
      <div class="spacer"></div>
      <span class="muted" style="font-size:12px">点击标签筛选</span>
    </div>
    <div class="tags" id="tag-bars"></div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <form class="search" id="search-form">
        <input id="search-input" placeholder="语义搜索，例如：docker 镜像拉不下来" autocomplete="off">
        <button class="btn" type="submit">搜索</button>
        <button class="btn ghost" type="button" id="clear-search" hidden>清除</button>
      </form>
      <label class="toggle"><input type="checkbox" id="include-deprecated"> 含已废弃</label>
      <span class="count" id="count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>摘要 / 目标</th>
            <th class="hide-sm">标签</th>
            <th>置信度</th>
            <th class="hide-sm">来源</th>
            <th class="hide-sm">写入时间</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div style="flex:1;min-width:0">
      <h2 id="d-title"></h2>
      <div id="d-badges"></div>
    </div>
    <button class="icon-btn" id="d-close" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
  <div class="drawer-foot">
    <button class="btn" id="d-copy">复制 ID</button>
    <button class="btn" id="d-supersede">以此替代</button>
    <div class="spacer" style="flex:1"></div>
    <button class="btn danger" id="d-deprecate">废弃</button>
  </div>
</aside>

<dialog class="sheet" id="create-dialog">
  <form id="create-form" novalidate>
    <div class="sheet-head">
      <h2>新建经验</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <label class="field"><span>摘要 *</span><input id="f-summary" maxlength="500" placeholder="一句话说清结论"></label>
      <label class="field"><span>任务目标 *</span><input id="f-goal" placeholder="这条经验服务于什么任务"></label>
      <div class="grid2">
        <label class="field"><span>适用场景 *</span><textarea id="f-applicable" rows="2" placeholder="环境、版本、前置条件"></textarea></label>
        <label class="field"><span>排除场景 *</span><textarea id="f-exclude" rows="2" placeholder="什么时候不能套用"></textarea></label>
      </div>
      <label class="field"><span>约束（每行一条）</span><textarea id="f-constraints" rows="2"></textarea></label>
      <label class="field"><span>成功步骤（每行一步）</span><textarea id="f-steps" rows="3"></textarea></label>
      <label class="field"><span>验证方式</span><input id="f-verification" placeholder="怎么证明它有效"></label>
      <fieldset class="attempts">
        <legend>失败尝试</legend>
        <div id="attempt-list"></div>
        <button class="btn ghost" type="button" id="add-attempt">+ 添加一条</button>
      </fieldset>
      <div class="grid2">
        <label class="field"><span>标签（逗号分隔）*</span><input id="f-tags" placeholder="docker, colima"></label>
        <label class="field"><span>来源 Agent *</span><input id="f-agent" value="dashboard"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>替代的记录 ID</span><input id="f-supersedes" placeholder="留空表示新增"></label>
        <label class="field"><span>置信度 <output id="conf-out">0.85</output></span><input id="f-confidence" type="range" min="0" max="1" step="0.05" value="0.85"></label>
      </div>
      <div class="notice warn" id="dedup-box" hidden></div>
      <div class="notice danger" id="form-error" hidden></div>
    </div>
    <div class="sheet-foot">
      <button class="btn ghost" type="button" data-close>取消</button>
      <button class="btn primary" type="submit" id="create-submit">保存</button>
    </div>
  </form>
</dialog>

<dialog class="sheet small" id="deprecate-dialog">
  <form id="deprecate-form">
    <div class="sheet-head">
      <h2>废弃记录</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <p class="muted mono" id="dep-target" style="font-size:12px;word-break:break-all"></p>
      <label class="field"><span>原因 *</span><textarea id="d-reason" rows="2" placeholder="为什么它不再适用"></textarea></label>
      <label class="field"><span>替代记录 ID</span><input id="d-superseded-by" placeholder="可选，指向新记录"></label>
      <div class="notice danger" id="dep-error" hidden></div>
    </div>
    <div class="sheet-foot">
      <button class="btn ghost" type="button" data-close>取消</button>
      <button class="btn danger" type="submit">确认废弃</button>
    </div>
  </form>
</dialog>

<div id="toasts"></div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const state = {
  project: '',
  records: [],
  mode: 'browse',
  query: '',
  includeDeprecated: false,
  activeTag: null,
  selected: null,
  pendingWrite: false,
};

const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[c]));

const fmtDate = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  let data = null;
  try { data = await res.json(); } catch { data = null; }
  if (!res.ok) {
    const detail = data && data.detail ? data.detail : `HTTP ${res.status}`;
    throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
  }
  return data;
}

function toast(message, kind = 'ok') {
  const node = document.createElement('div');
  node.className = `toast ${kind === 'error' ? 'error' : ''}`;
  node.textContent = message;
  $('#toasts').append(node);
  setTimeout(() => node.remove(), 4200);
}

function setBusy(busy) {
  $('#refresh').disabled = busy;
  $('#rows').style.opacity = busy ? '.45' : '1';
}

function visibleRecords() {
  if (!state.activeTag) return state.records;
  return state.records.filter((item) => (item.record.tags || []).includes(state.activeTag));
}

function render() {
  renderStats();
  renderTags();
  renderRows();
  $('#count').textContent = state.mode === 'search'
    ? `搜索命中 ${state.records.length} 条`
    : `共 ${state.records.length} 条`;
  $('#clear-search').hidden = state.mode !== 'search';
}

function renderStats() {
  const all = state.records;
  const active = all.filter((item) => !item.deprecated).length;
  const tags = new Set();
  all.forEach((item) => (item.record.tags || []).forEach((tag) => tags.add(tag)));
  const cards = [
    ['记录', all.length],
    ['生效', active],
    ['已废弃', all.length - active],
    ['标签', tags.size],
  ];
  $('#stats').innerHTML = cards.map(([k, v]) => `
    <div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>
  `).join('');
}

function renderTags() {
  const counts = new Map();
  state.records.forEach((item) => (item.record.tags || []).forEach((tag) => {
    counts.set(tag, (counts.get(tag) || 0) + 1);
  }));
  const entries = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);
  const max = entries.length ? entries[0][1] : 1;
  if (!entries.length) {
    $('#tag-bars').innerHTML = '<div class="empty-inline">暂无标签</div>';
    return;
  }
  $('#tag-bars').innerHTML = entries.map(([tag, count]) => `
    <div class="tag-row" data-tag="${esc(tag)}">
      <div class="tag-name">${esc(tag)}</div>
      <div class="tag-track"><div class="tag-fill" style="width:${Math.round((count / max) * 100)}%"></div></div>
      <div class="tag-count">${count}</div>
    </div>
  `).join('');
}

function renderRows() {
  const rows = visibleRecords();
  const tagNote = state.activeTag
    ? `<div class="filter-chip">标签：${esc(state.activeTag)} <button data-clear-tag aria-label="清除">✕</button></div>`
    : '';
  const head = $('.toolbar');
  let chip = head.querySelector('.filter-chip');
  if (state.activeTag) {
    if (!chip) {
      chip = document.createElement('div');
      head.insertBefore(chip, $('#count'));
    }
    chip.outerHTML = tagNote;
  } else if (chip) {
    chip.remove();
  }

  if (!rows.length) {
    $('#rows').innerHTML = `<tr><td colspan="6"><div class="empty">
      <strong>${state.mode === 'search' ? '没有匹配的记录' : '这个项目还没有经验记录'}</strong>
      ${state.mode === 'search' ? '换个说法，或清除搜索条件。' : '让 Curator 会话写入一条，或点右上角「新建经验」。'}
    </div></td></tr>`;
    return;
  }

  $('#rows').innerHTML = rows.map((item) => {
    const rec = item.record;
    const tags = (rec.tags || []).slice(0, 4).map((tag) => `<span class="chip">${esc(tag)}</span>`).join('');
    const conf = Math.max(0, Math.min(1, Number(rec.confidence) || 0));
    return `<tr data-id="${esc(item.id)}">
      <td>
        <div class="sum">${esc(rec.summary)}</div>
        <div class="goal">${esc(rec.task_goal)}</div>
      </td>
      <td class="hide-sm"><div class="chips">${tags}</div></td>
      <td><div class="conf">
        <div class="conf-track"><div class="conf-fill" style="width:${Math.round(conf * 100)}%"></div></div>
        <span class="conf-num">${conf.toFixed(2)}</span>
      </div></td>
      <td class="hide-sm muted">${esc(rec.source_agent)}</td>
      <td class="hide-sm muted">${fmtDate(item.created_at)}</td>
      <td>${item.deprecated
        ? '<span class="pill deprecated">已废弃</span>'
        : '<span class="pill active">有效</span>'}</td>
    </tr>`;
  }).join('');
}

async function load() {
  setBusy(true);
  try {
    const params = new URLSearchParams({
      project_id: state.project,
      include_deprecated: String(state.includeDeprecated),
      limit: '500',
    });
    state.records = await api(`/api/records?${params.toString()}`);
    state.mode = 'browse';
    state.query = '';
    state.activeTag = null;
    $('#search-input').value = '';
    render();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    setBusy(false);
  }
}

async function search() {
  const query = $('#search-input').value.trim();
  if (!query) return load();
  setBusy(true);
  try {
    state.records = await api('/api/search', {
      method: 'POST',
      body: JSON.stringify({
        query,
        project_id: state.project,
        top_k: 50,
        include_deprecated: state.includeDeprecated,
      }),
    });
    state.mode = 'search';
    state.query = query;
    state.activeTag = null;
    render();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    setBusy(false);
  }
}

async function openDetail(id) {
  try {
    const item = await api(`/api/records/${encodeURIComponent(id)}?project_id=${encodeURIComponent(state.project)}`);
    state.selected = item;
    renderDetail(item);
    $('#d-body').scrollTop = 0;
    $('#drawer').classList.add('show');
    $('#scrim').classList.add('show');
    $('#drawer').setAttribute('aria-hidden', 'false');
  } catch (err) {
    toast(err.message, 'error');
  }
}

function closeDetail() {
  $('#drawer').classList.remove('show');
  $('#scrim').classList.remove('show');
  $('#drawer').setAttribute('aria-hidden', 'true');
  state.selected = null;
}

function renderDetail(item) {
  const rec = item.record;
  $('#d-title').textContent = rec.summary;
  $('#d-badges').innerHTML = `
    ${item.deprecated ? '<span class="pill deprecated">已废弃</span>' : '<span class="pill active">有效</span>'}
    <span class="chip mono" style="margin-left:6px">${esc(item.id)}</span>`;
  $('#d-copy').dataset.id = item.id;

  const constraints = (rec.constraints || []).length
    ? `<div class="chips">${rec.constraints.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</div>`
    : '<span class="muted">—</span>';
  const steps = (rec.successful_solution.steps || []).length
    ? `<ol class="steps">${rec.successful_solution.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>`
    : '<span class="muted">—</span>';
  const attempts = (rec.failed_attempts || []).length
    ? rec.failed_attempts.map((a) => `<div class="attempt">
        <div class="row"><span class="lab">尝试</span>${esc(a.try_content)}</div>
        <div class="row"><span class="lab">根因</span>${esc(a.root_cause)}</div>
        <div class="row"><span class="lab">教训</span>${esc(a.lesson)}</div>
      </div>`).join('')
    : '<span class="muted">—</span>';
  const supersedes = rec.supersedes
    ? `<button class="link-btn mono" data-open="${esc(rec.supersedes)}">${esc(rec.supersedes)}</button>`
    : '<span class="muted">—</span>';
  const supersededBy = item.superseded_by
    ? `<button class="link-btn mono" data-open="${esc(item.superseded_by)}">${esc(item.superseded_by)}</button>`
    : '<span class="muted">—</span>';

  $('#d-body').innerHTML = `
    <div class="meta-grid">
      <div><div class="k">任务目标</div><div class="v">${esc(rec.task_goal)}</div></div>
      <div><div class="k">来源 Agent</div><div class="v">${esc(rec.source_agent)}</div></div>
      <div><div class="k">置信度</div><div class="v">${Number(rec.confidence).toFixed(2)}</div></div>
      <div><div class="k">写入时间</div><div class="v">${fmtDate(item.created_at)}</div></div>
      <div><div class="k">替代</div><div class="v">${supersedes}</div></div>
      <div><div class="k">被替代</div><div class="v">${supersededBy}</div></div>
    </div>
    <div class="section"><h3>适用场景</h3><p class="kv">${esc(rec.applicable_scope)}</p></div>
    <div class="section"><h3>排除场景</h3><p class="kv">${esc(rec.exclude_scope)}</p></div>
    <div class="section"><h3>约束</h3>${constraints}</div>
    <div class="section"><h3>成功方案</h3>${steps}
      <p class="muted" style="margin-top:8px">验证：${esc(rec.successful_solution.verification) || '—'}</p>
    </div>
    <div class="section"><h3>失败尝试</h3>${attempts}</div>
    <div class="section"><h3>标签</h3>
      <div class="chips">${(rec.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>
    </div>`;

  $('#d-deprecate').disabled = item.deprecated;
}

function openCreate(prefill = {}) {
  $('#create-form').reset();
  $('#f-agent').value = prefill.source_agent || 'dashboard';
  $('#f-supersedes').value = prefill.supersedes || '';
  $('#f-confidence').value = '0.85';
  $('#conf-out').textContent = '0.85';
  $('#attempt-list').innerHTML = '';
  $('#dedup-box').hidden = true;
  $('#form-error').hidden = true;
  state.pendingWrite = false;
  $('#create-submit').textContent = '保存';
  if (prefill.summary) $('#f-summary').value = prefill.summary;
  $('#create-dialog').showModal();
  setTimeout(() => $('#f-summary').focus(), 30);
}

function addAttempt() {
  const node = document.createElement('div');
  node.className = 'attempt-inputs';
  node.innerHTML = `
    <input data-k="try_content" placeholder="尝试了什么">
    <input data-k="root_cause" placeholder="根因">
    <input data-k="lesson" placeholder="教训">
    <button class="icon-btn" type="button" data-remove aria-label="删除">✕</button>`;
  $('#attempt-list').append(node);
}

const lines = (id) => $(id).value.split('\n').map((s) => s.trim()).filter(Boolean);

function buildRecord() {
  const attempts = $$('#attempt-list .attempt-inputs').map((row) => {
    const get = (k) => row.querySelector(`[data-k="${k}"]`).value.trim();
    return { try_content: get('try_content'), root_cause: get('root_cause'), lesson: get('lesson') };
  }).filter((a) => a.try_content || a.root_cause || a.lesson);

  return {
    summary: $('#f-summary').value.trim(),
    task_goal: $('#f-goal').value.trim(),
    constraints: lines('#f-constraints'),
    successful_solution: { steps: lines('#f-steps'), verification: $('#f-verification').value.trim() },
    failed_attempts: attempts,
    applicable_scope: $('#f-applicable').value.trim(),
    exclude_scope: $('#f-exclude').value.trim(),
    tags: $('#f-tags').value.split(',').map((s) => s.trim()).filter(Boolean),
    supersedes: $('#f-supersedes').value.trim(),
    source_agent: $('#f-agent').value.trim() || 'dashboard',
    confidence: Number($('#f-confidence').value),
  };
}

function validate(record) {
  const missing = [];
  if (!record.summary) missing.push('摘要');
  if (!record.task_goal) missing.push('任务目标');
  if (!record.applicable_scope) missing.push('适用场景');
  if (!record.exclude_scope) missing.push('排除场景');
  if (!record.tags.length) missing.push('标签');
  if (!record.source_agent) missing.push('来源 Agent');
  const blankAttempt = record.failed_attempts.find((a) => !a.try_content || !a.root_cause || !a.lesson);
  if (blankAttempt) missing.push('失败尝试的三项要填完整');
  return missing;
}

async function submitCreate(event) {
  event.preventDefault();
  const record = buildRecord();
  const missing = validate(record);
  const errorBox = $('#form-error');
  if (missing.length) {
    errorBox.hidden = false;
    errorBox.textContent = `还缺少：${missing.join('、')}`;
    return;
  }
  errorBox.hidden = true;

  if (!state.pendingWrite) {
    try {
      const candidates = await api('/api/dedup', {
        method: 'POST',
        body: JSON.stringify({ query: record.summary, project_id: state.project, top_k: 5 }),
      });
      if (candidates && candidates.length) {
        const box = $('#dedup-box');
        box.hidden = false;
        box.innerHTML = `发现 ${candidates.length} 条相近记录，建议先看是否需要替代：<ul>${
          candidates.map((c) => `<li>${esc(c.summary)}（${(Number(c.score) || 0).toFixed(2)}）</li>`).join('')
        }</ul>确认要作为新记录写入，请再点一次。`;
        state.pendingWrite = true;
        $('#create-submit').textContent = '仍然写入';
        return;
      }
    } catch (err) {
      toast(`查重失败：${err.message}`, 'error');
      return;
    }
  }

  try {
    $('#create-submit').disabled = true;
    await api('/api/records', {
      method: 'POST',
      body: JSON.stringify({ project_id: state.project, record }),
    });
    $('#create-dialog').close();
    toast('已写入');
    await load();
  } catch (err) {
    errorBox.hidden = false;
    errorBox.textContent = err.message;
  } finally {
    $('#create-submit').disabled = false;
    state.pendingWrite = false;
    $('#create-submit').textContent = '保存';
  }
}

function openDeprecate(item) {
  $('#deprecate-form').reset();
  $('#dep-error').hidden = true;
  $('#dep-target').textContent = `${item.record.summary}\n${item.id}`;
  $('#dep-target').style.whiteSpace = 'pre-line';
  $('#deprecate-dialog').showModal();
  $('#deprecate-dialog').dataset.id = item.id;
  setTimeout(() => $('#d-reason').focus(), 30);
}

async function submitDeprecate(event) {
  event.preventDefault();
  const id = $('#deprecate-dialog').dataset.id;
  const reason = $('#d-reason').value.trim();
  if (!reason) {
    $('#dep-error').hidden = false;
    $('#dep-error').textContent = '请填写废弃原因';
    return;
  }
  try {
    await api(`/api/records/${encodeURIComponent(id)}/deprecate`, {
      method: 'POST',
      body: JSON.stringify({
        project_id: state.project,
        reason,
        superseded_by: $('#d-superseded-by').value.trim(),
      }),
    });
    $('#deprecate-dialog').close();
    closeDetail();
    toast('已标记废弃');
    await load();
  } catch (err) {
    $('#dep-error').hidden = false;
    $('#dep-error').textContent = err.message;
  }
}

function bind() {
  $('#refresh').addEventListener('click', load);
  $('#project').addEventListener('change', () => {
    const value = $('#project').value.trim();
    if (value && value !== state.project) {
      state.project = value;
      load();
    }
  });
  $('#search-form').addEventListener('submit', (event) => { event.preventDefault(); search(); });
  $('#clear-search').addEventListener('click', load);
  $('#include-deprecated').addEventListener('change', () => {
    state.includeDeprecated = $('#include-deprecated').checked;
    if (state.mode === 'search') search(); else load();
  });
  $('#new-record').addEventListener('click', () => openCreate());

  $('#rows').addEventListener('click', (event) => {
    const row = event.target.closest('tr[data-id]');
    if (row) openDetail(row.dataset.id);
  });
  $('#tag-bars').addEventListener('click', (event) => {
    const row = event.target.closest('[data-tag]');
    if (!row) return;
    state.activeTag = state.activeTag === row.dataset.tag ? null : row.dataset.tag;
    renderRows();
  });
  $('.toolbar').addEventListener('click', (event) => {
    if (event.target.closest('[data-clear-tag]')) {
      state.activeTag = null;
      renderRows();
    }
  });

  $('#d-close').addEventListener('click', closeDetail);
  $('#scrim').addEventListener('click', closeDetail);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeDetail();
  });
  $('#d-copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('#d-copy').dataset.id || '');
      toast('ID 已复制');
    } catch {
      toast('复制失败，请手动选择', 'error');
    }
  });
  $('#d-supersede').addEventListener('click', () => {
    const item = state.selected;
    if (!item) return;
    state.pendingWrite = false;
    openCreate({ supersedes: item.id, summary: '' });
  });
  $('#d-deprecate').addEventListener('click', () => {
    if (state.selected) openDeprecate(state.selected);
  });
  $('#d-body').addEventListener('click', (event) => {
    const btn = event.target.closest('[data-open]');
    if (btn) openDetail(btn.dataset.open);
  });

  $('#add-attempt').addEventListener('click', addAttempt);
  $('#attempt-list').addEventListener('click', (event) => {
    if (event.target.closest('[data-remove]')) event.target.closest('.attempt-inputs').remove();
  });
  $('#f-confidence').addEventListener('input', () => {
    $('#conf-out').textContent = Number($('#f-confidence').value).toFixed(2);
  });
  $('#create-form').addEventListener('submit', submitCreate);
  $('#deprecate-form').addEventListener('submit', submitDeprecate);

  $$('[data-close]').forEach((btn) => {
    btn.addEventListener('click', () => btn.closest('dialog').close());
  });
  $$('dialog').forEach((dialog) => {
    dialog.addEventListener('close', () => {
      state.pendingWrite = false;
      $('#create-submit').textContent = '保存';
    });
  });
}

(async function init() {
  bind();
  try {
    const cfg = await api('/api/config');
    state.project = cfg.project_id;
    $('#project').value = cfg.project_id;
    if (!cfg.writable) toast('服务端没有配置 API key，写入会被拒绝', 'error');
  } catch (err) {
    toast(err.message, 'error');
  }
  await load();
})();
</script>
</body>
</html>
